name: AI Final Scientific Evaluation v0.1

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN_FROZEN_AI_EVALUATION_V0_1 to authorize the audited held-out evaluation"
        required: true
        type: string
      resume_run_id:
        description: "Optional immediately prior evaluation workflow run ID whose durable artifacts must be restored"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ai-final-scientific-evaluation-v0.1
  cancel-in-progress: false

env:
  PAPER2_AI_FINAL_EVALUATION_AUTHORIZED: "YES"
  PAPER2_AI_FROZEN_EVALUATOR_SHA: "9e42c4a39e6bc8be94d1ed44e993899e4d916481"
  PAPER2_AI_FROZEN_WORKFLOW_SHA: ${{ github.workflow_sha }}
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHONHASHSEED: "0"
  PYTHONPATH: "evaluator/src"

jobs:
  prepare:
    name: Prepare frozen evaluation inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      origin_run_id: ${{ steps.run_contract.outputs.origin_run_id }}
    steps:
      - name: Require explicit frozen-run confirmation
        env:
          CONFIRMATION_INPUT: ${{ inputs.confirmation }}
          RESUME_RUN_ID_INPUT: ${{ inputs.resume_run_id }}
        run: |
          test "${CONFIRMATION_INPUT}" = "RUN_FROZEN_AI_EVALUATION_V0_1"
          test "${GITHUB_REPOSITORY}" = "plinhnguyende-svg/Paper-2-model0"
          test "${GITHUB_REF}" = "refs/heads/ai-final-evaluation-v0.1-frozen"
          test "${GITHUB_WORKFLOW_REF}" = "plinhnguyende-svg/Paper-2-model0/.github/workflows/ai_final_evaluation_v0.1.yml@refs/heads/ai-final-evaluation-v0.1-frozen"
          test "${GITHUB_SHA}" = "${GITHUB_WORKFLOW_SHA}"
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          if [ -n "${RESUME_RUN_ID_INPUT}" ] && ! [[ "${RESUME_RUN_ID_INPUT}" =~ ^[1-9][0-9]*$ ]]; then
            echo "resume_run_id must be a positive numeric prior workflow run id" >&2
            exit 1
          fi

      - name: Check out audited workflow control layer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false

      - name: Check out frozen evaluator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "9e42c4a39e6bc8be94d1ed44e993899e4d916481"
          path: evaluator
          persist-credentials: false

      - name: Set up locked Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            evaluator/requirements-ai-training-v0.1.txt
            evaluator/constraints-ai-training-v0.1.txt

      - name: Install locked scientific runtime
        run: |
          python -m pip install --disable-pip-version-check "pip==26.2.1"
          python -m pip install --disable-pip-version-check -r evaluator/requirements-ai-training-v0.1.txt -c evaluator/constraints-ai-training-v0.1.txt
          python -m pip check

      - name: Restore prior run contract
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ai-final-evaluation-run-contract-v0.1
          path: restored/run-contract
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_run_id }}

      - name: Build and validate immutable run contract
        id: run_contract
        env:
          RESUME_RUN_ID_INPUT: ${{ inputs.resume_run_id }}
        run: |
          ARGS=()
          if [ -n "${RESUME_RUN_ID_INPUT}" ]; then
            ARGS+=(--resume-run-id "${RESUME_RUN_ID_INPUT}" --prior-manifest restored/run-contract/run_contract.json)
          fi
          python control/scripts/ai_evaluation_workflow_guard.py prepare-run             --control-root control             --output outputs/workflow/run_contract.json             "${ARGS[@]}"
          ORIGIN_RUN_ID="$(python -c 'import json; print(json.load(open("outputs/workflow/run_contract.json"))["origin_run_id"])')"
          echo "origin_run_id=${ORIGIN_RUN_ID}" >> "${GITHUB_OUTPUT}"

      - name: Download and verify all fifteen frozen training archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python evaluator/scripts/audit_ai_evaluation_archives.py             --download             --archive-dir outputs/checkpoints/archives             --output outputs/checkpoints/loader_audit.json

      - name: Persist verified checkpoint bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-final-evaluation-checkpoints-v0.1
          path: outputs/checkpoints
          if-no-files-found: error
          retention-days: 90

      - name: Persist immutable run contract
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-final-evaluation-run-contract-v0.1
          path: outputs/workflow/run_contract.json
          if-no-files-found: error
          retention-days: 90

  evaluate:
    name: "Evaluate ${{ matrix.shard_name }}"
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - { shard_id: 0, shard_name: "shard-000" }
          - { shard_id: 1, shard_name: "shard-001" }
          - { shard_id: 2, shard_name: "shard-002" }
          - { shard_id: 3, shard_name: "shard-003" }
          - { shard_id: 4, shard_name: "shard-004" }
          - { shard_id: 5, shard_name: "shard-005" }
          - { shard_id: 6, shard_name: "shard-006" }
          - { shard_id: 7, shard_name: "shard-007" }
          - { shard_id: 8, shard_name: "shard-008" }
          - { shard_id: 9, shard_name: "shard-009" }
          - { shard_id: 10, shard_name: "shard-010" }
          - { shard_id: 11, shard_name: "shard-011" }
          - { shard_id: 12, shard_name: "shard-012" }
          - { shard_id: 13, shard_name: "shard-013" }
          - { shard_id: 14, shard_name: "shard-014" }
          - { shard_id: 15, shard_name: "shard-015" }
          - { shard_id: 16, shard_name: "shard-016" }
          - { shard_id: 17, shard_name: "shard-017" }
          - { shard_id: 18, shard_name: "shard-018" }
          - { shard_id: 19, shard_name: "shard-019" }
          - { shard_id: 20, shard_name: "shard-020" }
          - { shard_id: 21, shard_name: "shard-021" }
          - { shard_id: 22, shard_name: "shard-022" }
          - { shard_id: 23, shard_name: "shard-023" }
          - { shard_id: 24, shard_name: "shard-024" }
          - { shard_id: 25, shard_name: "shard-025" }
          - { shard_id: 26, shard_name: "shard-026" }
          - { shard_id: 27, shard_name: "shard-027" }
          - { shard_id: 28, shard_name: "shard-028" }
          - { shard_id: 29, shard_name: "shard-029" }
          - { shard_id: 30, shard_name: "shard-030" }
          - { shard_id: 31, shard_name: "shard-031" }
          - { shard_id: 32, shard_name: "shard-032" }
          - { shard_id: 33, shard_name: "shard-033" }
          - { shard_id: 34, shard_name: "shard-034" }
          - { shard_id: 35, shard_name: "shard-035" }
          - { shard_id: 36, shard_name: "shard-036" }
          - { shard_id: 37, shard_name: "shard-037" }
          - { shard_id: 38, shard_name: "shard-038" }
          - { shard_id: 39, shard_name: "shard-039" }
    steps:
      - name: Check out audited workflow control layer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false

      - name: Check out frozen evaluator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "9e42c4a39e6bc8be94d1ed44e993899e4d916481"
          path: evaluator
          persist-credentials: false

      - name: Set up locked Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            evaluator/requirements-ai-training-v0.1.txt
            evaluator/constraints-ai-training-v0.1.txt

      - name: Install locked scientific runtime
        run: |
          python -m pip install --disable-pip-version-check "pip==26.2.1"
          python -m pip install --disable-pip-version-check -r evaluator/requirements-ai-training-v0.1.txt -c evaluator/constraints-ai-training-v0.1.txt
          python -m pip check

      - name: Restore current immutable run contract
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ai-final-evaluation-run-contract-v0.1
          path: current/run-contract

      - name: Restore verified checkpoint bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ai-final-evaluation-checkpoints-v0.1
          path: checkpoint-bundle

      - name: Restore prior committed shard state
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: "${{ matrix.shard_name }}"
          path: "outputs/shards/${{ matrix.shard_name }}"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_run_id }}

      - name: Validate workflow and restored shard provenance
        env:
          RESUME_RUN_ID_INPUT: ${{ inputs.resume_run_id }}
        run: |
          python control/scripts/ai_evaluation_workflow_guard.py validate-current-run             --control-root control             --manifest current/run-contract/run_contract.json
          if [ -n "${RESUME_RUN_ID_INPUT}" ]; then
            python control/scripts/ai_evaluation_workflow_guard.py validate-restored-shard               --manifest current/run-contract/run_contract.json               --shard-dir "outputs/shards/${{ matrix.shard_name }}"               --shard-id "${{ matrix.shard_id }}"
          else
            test ! -e "outputs/shards/${{ matrix.shard_name }}"
          fi

      - name: Run frozen held-out evaluation shard
        timeout-minutes: 300
        env:
          RESUME_RUN_ID_INPUT: ${{ inputs.resume_run_id }}
          ORIGIN_RUN_ID: ${{ needs.prepare.outputs.origin_run_id }}
        run: |
          RESUME_ARGS=()
          if [ -n "${RESUME_RUN_ID_INPUT}" ]; then
            RESUME_ARGS+=(--resume)
          fi
          python evaluator/scripts/run_ai_evaluation_shard.py             --archive-dir checkpoint-bundle/archives             --output-dir "outputs/shards/${{ matrix.shard_name }}"             --shard-id "${{ matrix.shard_id }}"             --origin-run-id "${ORIGIN_RUN_ID}"             "${RESUME_ARGS[@]}"

      - name: Persist committed shard recovery state
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "${{ matrix.shard_name }}"
          path: "outputs/shards/${{ matrix.shard_name }}"
          if-no-files-found: error
          retention-days: 90

  collect:
    name: Collect exact 3,600-row panel
    needs: [prepare, evaluate]
    if: ${{ needs.evaluate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out audited workflow control layer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false

      - name: Check out frozen evaluator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "9e42c4a39e6bc8be94d1ed44e993899e4d916481"
          path: evaluator
          persist-credentials: false

      - name: Set up locked Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"

      - name: Install locked scientific runtime
        run: |
          python -m pip install --disable-pip-version-check "pip==26.2.1"
          python -m pip install --disable-pip-version-check -r evaluator/requirements-ai-training-v0.1.txt -c evaluator/constraints-ai-training-v0.1.txt
          python -m pip check

      - name: Restore current immutable run contract
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ai-final-evaluation-run-contract-v0.1
          path: current/run-contract

      - name: Restore all forty completed shard artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: "shard-*"
          path: outputs/shards
          merge-multiple: false

      - name: Validate exact collector input set
        run: |
          python control/scripts/ai_evaluation_workflow_guard.py validate-current-run             --control-root control             --manifest current/run-contract/run_contract.json
          python control/scripts/ai_evaluation_workflow_guard.py validate-collector-set             --manifest current/run-contract/run_contract.json             --shard-parent outputs/shards

      - name: Collect frozen final panel
        env:
          ORIGIN_RUN_ID: ${{ needs.prepare.outputs.origin_run_id }}
        run: |
          python evaluator/scripts/collect_ai_evaluation.py             --shard-parent outputs/shards             --output-file outputs/final/panel.jsonl             --origin-run-id "${ORIGIN_RUN_ID}"

      - name: Persist final panel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-final-evaluation-panel-v0.1
          path: outputs/final/panel.jsonl
          if-no-files-found: error
          retention-days: 90
