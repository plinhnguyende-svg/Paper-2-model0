name: AI Full Training Freeze Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-frozen-runtime:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up locked Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            requirements-ai-training-v0.1.txt
            constraints-ai-training-v0.1.txt

      - name: Install frozen scientific runtime without training
        run: |
          python -m pip install --disable-pip-version-check "pip==26.2.1"
          python -m pip install --disable-pip-version-check             -r requirements-ai-training-v0.1.txt             -c constraints-ai-training-v0.1.txt
          python -m pip install --disable-pip-version-check "pytest==9.1.1"
          python -m pip check

      - name: Verify exact runtime versions
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import platform
          import numpy
          import pandas
          import torch
          import yaml

          assert platform.python_version() == "3.12.14"
          assert numpy.__version__ == "2.5.3"
          assert pandas.__version__ == "3.0.6"
          assert yaml.__version__ == "6.0.3"
          assert torch.__version__ == "2.14.0"
          print("locked full-training runtime resolved successfully")
          PY

      - name: Run workflow contract tests only
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q             tests/test_ai_full_training_workflow.py             tests/test_ai_launcher.py
