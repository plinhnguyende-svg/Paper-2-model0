name: AI Full Scientific Training v0.1

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN_FROZEN_AI_V0_1 to authorize the audited 15-job run"
        required: true
        type: string
      resume_run_id:
        description: "Optional prior workflow run ID whose 15 job artifacts must be restored"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ai-full-scientific-training-v0.1
  cancel-in-progress: false

jobs:
  train:
    name: "${{ matrix.regime }} / seed ${{ matrix.training_seed }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - { regime: N, training_seed: 41001 }
          - { regime: N, training_seed: 41002 }
          - { regime: N, training_seed: 41003 }
          - { regime: N, training_seed: 41004 }
          - { regime: N, training_seed: 41005 }
          - { regime: S, training_seed: 41001 }
          - { regime: S, training_seed: 41002 }
          - { regime: S, training_seed: 41003 }
          - { regime: S, training_seed: 41004 }
          - { regime: S, training_seed: 41005 }
          - { regime: F, training_seed: 41001 }
          - { regime: F, training_seed: 41002 }
          - { regime: F, training_seed: 41003 }
          - { regime: F, training_seed: 41004 }
          - { regime: F, training_seed: 41005 }
    env:
      PAPER2_AI_FULL_TRAINING_AUTHORIZED: "YES"
      PAPER2_AI_FROZEN_LAUNCHER_SHA: "fb4f386703294990917e9d99e10013925a9a54d6"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
      PYTHONPATH: "src"

    steps:
      - name: Require explicit frozen-run confirmation
        env:
          CONFIRMATION_INPUT: ${{ inputs.confirmation }}
          RESUME_RUN_ID_INPUT: ${{ inputs.resume_run_id }}
        run: |
          test "${CONFIRMATION_INPUT}" = "RUN_FROZEN_AI_V0_1"
          test "${GITHUB_REF}" = "refs/heads/ai-full-training-v0.1-frozen"
          if [ -n "${RESUME_RUN_ID_INPUT}" ] && ! [[ "${RESUME_RUN_ID_INPUT}" =~ ^[1-9][0-9]*$ ]]; then
            echo "resume_run_id must be a positive numeric prior workflow run id" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Set up locked Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            requirements-ai-training-v0.1.txt
            constraints-ai-training-v0.1.txt

      - name: Install locked scientific runtime
        run: |
          python -m pip install --disable-pip-version-check "pip==26.2.1"
          python -m pip install --disable-pip-version-check             -r requirements-ai-training-v0.1.txt             -c constraints-ai-training-v0.1.txt
          python -m pip check

      - name: Restore committed episode-boundary state
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: "ai-training-${{ matrix.regime }}-seed-${{ matrix.training_seed }}"
          path: "outputs/ai_full_training_v0.1/regime_${{ matrix.regime }}/seed_${{ matrix.training_seed }}"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_run_id }}

      - name: Validate frozen job and restored state
        env:
          RESUME_RUN_ID_INPUT: ${{ inputs.resume_run_id }}
        run: |
          RESUME_ARGS=()
          if [ -n "${RESUME_RUN_ID_INPUT}" ]; then
            RESUME_ARGS+=(--require-existing-state --resume-run-id "${RESUME_RUN_ID_INPUT}")
          fi
          python scripts/run_ai_full_training_job.py \
            --regime "${{ matrix.regime }}" \
            --training-seed "${{ matrix.training_seed }}" \
            --validate-only \
            "${RESUME_ARGS[@]}"

      - name: Run frozen scientific training job
        timeout-minutes: 300
        env:
          RESUME_RUN_ID_INPUT: ${{ inputs.resume_run_id }}
        run: |
          RESUME_ARGS=()
          if [ -n "${RESUME_RUN_ID_INPUT}" ]; then
            RESUME_ARGS+=(--require-existing-state --resume-run-id "${RESUME_RUN_ID_INPUT}")
          fi
          python scripts/run_ai_full_training_job.py \
            --regime "${{ matrix.regime }}" \
            --training-seed "${{ matrix.training_seed }}" \
            "${RESUME_ARGS[@]}"

      - name: Persist committed recovery state
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: "ai-training-${{ matrix.regime }}-seed-${{ matrix.training_seed }}"
          path: "outputs/ai_full_training_v0.1/regime_${{ matrix.regime }}/seed_${{ matrix.training_seed }}"
          if-no-files-found: error
          retention-days: 90
