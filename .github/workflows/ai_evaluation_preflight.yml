name: AI Evaluation Real Archive Preflight

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/paper2_model0/ai/evaluation*'
      - 'scripts/audit_ai_evaluation_archives.py'
      - '.github/workflows/ai_evaluation_preflight.yml'

permissions:
  contents: read
  actions: read

jobs:
  loader:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install training runtime without relaxing pins
        run: |
          python -m pip install --disable-pip-version-check 'pip==26.2.1'
          python -m pip install -r requirements-ai-training-v0.1.txt -c constraints-ai-training-v0.1.txt
          python -m pip check
      - name: Load exactly fifteen registered archives without simulation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/audit_ai_evaluation_archives.py --download --archive-dir outputs/preflight/archives --output outputs/preflight/loader_audit.json
      - name: Run synthetic fixture only
        run: python scripts/run_ai_evaluation_dry_run.py
      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evaluation-loader-audit-${{ github.event.pull_request.head.sha }}
          path: outputs/preflight/loader_audit.json
          if-no-files-found: error
          retention-days: 90
