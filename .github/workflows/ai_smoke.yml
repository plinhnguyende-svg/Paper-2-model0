name: AI Smoke Training

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/paper2_model0/ai/**"
      - "scripts/run_ai_smoke_training.py"
      - "tests/test_ai_smoke_training.py"
      - ".github/workflows/ai_smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with AI dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ai]"
      - name: Run smoke-training harness
        run: python scripts/run_ai_smoke_training.py
      - name: Upload smoke summary
        uses: actions/upload-artifact@v4
        with:
          name: ai-smoke-${{ github.run_id }}
          path: outputs/ai_smoke_v0.1/smoke_summary.json
          if-no-files-found: error
