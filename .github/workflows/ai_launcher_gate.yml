name: AI Launcher Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "AI_15RUN_LAUNCHER_PLAN_v0.1.md"
      - "src/paper2_model0/ai/launcher.py"
      - "scripts/run_ai_launcher_dry_run.py"
      - "tests/test_ai_launcher.py"
      - ".github/workflows/ai_launcher_gate.yml"

permissions:
  contents: read

jobs:
  dry-run-only:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with AI dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ai]"
      - name: Verify launcher contract tests
        run: python -m pytest -q tests/test_ai_launcher.py
      - name: Generate dry-run 15-job plan
        run: python scripts/run_ai_launcher_dry_run.py
      - name: Upload dry-run plan
        uses: actions/upload-artifact@v4
        with:
          name: ai-launcher-dry-run-${{ github.run_id }}
          path: outputs/ai_launcher_dry_run_v0.1/launcher_plan.json
          if-no-files-found: error
