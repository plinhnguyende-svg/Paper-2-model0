name: AI Final Evaluation Workflow Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ai_final_evaluation_v0.1.yml'
      - '.github/workflows/ai_final_evaluation_workflow_gate.yml'
      - 'scripts/ai_evaluation_workflow_guard.py'
      - 'tests/test_ai_final_evaluation_workflow.py'
      - 'AI_FINAL_EVALUATION_WORKFLOW_AUDIT_v0.1.md'

permissions:
  contents: read

jobs:
  orchestration-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up locked Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install locked scientific runtime
        run: |
          python -m pip install --disable-pip-version-check 'pip==26.2.1'
          python -m pip install --disable-pip-version-check -r requirements-ai-training-v0.1.txt -c constraints-ai-training-v0.1.txt
          python -m pip check

      - name: Install pinned test-only harness
        run: |
          python -m pip install --no-deps             'pytest==9.1.1'             'iniconfig==2.3.0'             'packaging==26.3'             'pluggy==1.6.0'             'pygments==2.21.0'

      - name: Run synthetic no-held-out workflow contract suite
        run: |
          python -m pytest -q             tests/test_ai_final_evaluation_workflow.py             tests/test_ai_evaluation_execution.py
          python scripts/ai_evaluation_workflow_guard.py --help
          mkdir -p outputs/workflow_gate
          python - <<'PY'
          import json
          from pathlib import Path
          payload = {
              "status": "PASS_SYNTHETIC_ONLY",
              "heldout_scenarios_generated": 0,
              "scientific_evaluation_dispatched": False,
              "cases": [
                  "first_run",
                  "partial_failure_resume",
                  "completed_shard_resume",
                  "missing_artifact",
                  "wrong_prior_run",
                  "wrong_sha_or_ref",
                  "github_rerun_attempt_forbidden",
                  "collector_incomplete",
                  "full_40_shard_3600_row_synthetic_evidence",
              ],
          }
          Path("outputs/workflow_gate/summary.json").write_text(
              json.dumps(payload, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Preserve synthetic gate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-final-evaluation-workflow-gate-${{ github.event.pull_request.head.sha }}
          path: outputs/workflow_gate/summary.json
          if-no-files-found: error
          retention-days: 90
