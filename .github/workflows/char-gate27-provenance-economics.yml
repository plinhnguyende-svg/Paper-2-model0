name: CHAR Gate 27 verification provenance and continuous economic design
on:
  workflow_dispatch:
  pull_request:
    branches: [research/char-refi-standalone]
    paths:
      - '.github/workflows/char-gate27-provenance-economics.yml'
      - 'scripts/gate27_verified_build_and_proxy.py'
      - 'scripts/gate27_continuous_equilibrium.py'
      - 'tests/test_gate27_verified_build_and_proxy.py'
      - 'tests/test_gate27_continuous_equilibrium.py'
      - 'docs/GATE27_PROVENANCE_AND_CONDITIONAL_EQUILIBRIUM.md'
permissions:
  contents: read
jobs:
  targeted-provenance:
    name: Targeted verified-build metadata and historical proxy change
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Test provenance parser and proxy storage guardrails (offline)
        run: python3 -m unittest discover -s tests -p 'test_gate27_verified_build_and_proxy.py' -v
      - name: Read declared Base history and targeted explorer provenance
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: |
          set -euo pipefail
          python3 scripts/gate27_verified_build_and_proxy.py --out gate27/provenance | tee gate27_PROVENANCE.log
      - name: Archive public verification responses and RPC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: char-gate27-targeted-provenance
          path: |
            gate27/provenance/**
            gate27_PROVENANCE.log
          if-no-files-found: warn

  conditional-economics:
    name: Real-formula conditional equilibrium and continuous scale inverse
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check exact inverse FOC against global Gate 20 solver
        run: python3 -m unittest discover -s tests -p 'test_gate27_continuous_equilibrium.py' -v
      - name: Construct fixed-state continuous-scale equilibrium candidate
        run: python3 scripts/gate27_continuous_equilibrium.py --out results/gate27
      - name: Archive conditional mathematical outputs (synthetic)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: char-gate27-conditional-economic-equilibrium
          path: |
            results/gate27/**
          if-no-files-found: warn
