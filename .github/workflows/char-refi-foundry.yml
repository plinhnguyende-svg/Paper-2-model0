name: CHAR ReFi Foundry validation
on:
  push:
    branches: [research/char-refi-standalone, main]
  workflow_dispatch:
  pull_request:
    branches: [research/char-refi-standalone]

permissions:
  contents: read

jobs:
  source-evm:
    name: Toucan source-level EVM tests (no mainnet claims)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Enforce research boundary and data provenance
        run: python3 scripts/check_research_boundary.py

      - name: Download pinned upstream dependencies
        run: |
          set -euo pipefail
          mkdir -p lib
          git clone https://github.com/ToucanProtocol/dynamic-fee-pools.git lib/dynamic-fee-pools
          git -C lib/dynamic-fee-pools checkout --detach 7aef954dae1bd0c7add4ed66d216251110521b16
          git clone --depth 1 --branch v4.9.6 https://github.com/OpenZeppelin/openzeppelin-contracts.git lib/openzeppelin-contracts
          git clone --depth 1 --branch v4.0.3 https://github.com/PaulRBerg/prb-math.git lib/prb-math
          echo "Foundry $(forge --version)" | tee SOURCE_PIN_MANIFEST.txt
          for d in lib/dynamic-fee-pools lib/openzeppelin-contracts lib/prb-math; do
            echo "$d $(git -C "$d" rev-parse HEAD)" | tee -a SOURCE_PIN_MANIFEST.txt
          done

      - name: Run exact-source EVM boundary tests
        run: |
          set -euo pipefail
          forge test --match-path test/SourceCHARBoundary.t.sol -vvvv 2>&1 | tee FOUNDRY_RESULTS.log

      - name: Execute deployed Base FeeCalculator fork tests (pinned block)
        if: always()
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: |
          set -o pipefail
          RPC="${BASE_RPC_URL:-https://mainnet.base.org}"
          if forge test --match-path test/DeployedFeeCalculatorFork.t.sol \
              --fork-url "$RPC" --fork-block-number 58258072 -vvv \
              2>&1 | tee FORK_RESULTS.log; then
            echo "FORK_EVM_PASS at Base block 58258072" > FORK_STATUS.txt
          else
            echo "FORK_EVM_NOT_VERIFIED_OR_FAILED: check FORK_RESULTS.log" > FORK_STATUS.txt
            exit 1
          fi
          cat FORK_STATUS.txt

      - name: Snapshot current Base state, separately from tests
        if: always()
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: |
          bash scripts/snapshot_base.sh block_state
          cat block_state/STATUS.txt

      - name: Historical FeeSetup transaction and same-block contract state (best effort)
        if: always()
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: |
          bash scripts/audit_historical_base.sh \
            0x1e4187be16964075654028ea7c92c02fc798d4bb097cab53efb5847cd85c91c0 \
            historical_base_evidence
          cat historical_base_evidence/STATUS.txt

      - name: Audit two historical proxy upgrades (archive RPC required)
        if: always()
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: |
          bash scripts/audit_historical_blocks.sh history
          echo "Historical audit done. Every call's STATUS is authoritative; workflow success does not imply matching."

      - name: Archive test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: char-refi-foundry-evidence
          path: |
            FOUNDRY_RESULTS.log
            FORK_RESULTS.log
            FORK_STATUS.txt
            SOURCE_PIN_MANIFEST.txt
            block_state/**
            history/**
            historical_base_evidence/**
          if-no-files-found: warn

  economic-revalidation:
    name: Gate 18 economic revalidation (offline, conditional model)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Revalidate economics and accounting
        run: python3 -m unittest discover -s tests -p 'test_gate18.py' -v
      - name: Enumerate declared finite policy problem
        run: python3 scripts/gate18_model.py --out results/gate18
      - name: Archive synthetic results and model scope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate18-economic-revalidation
          path: |
            results/gate18/**
            docs/GATE18*
            config/benchmarks.json
            config/gate18_input_provenance.json
          if-no-files-found: error

  original-economic-replay:
    name: Gates 9-13 original numerical replay (synthetic)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install recorded numerical dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 matplotlib==3.10.8
      - name: Replay recovered originals and compare small reference summaries
        run: python scripts/replay_original_economics.py --out results/gate18/replay_ci
      - name: Archive original replay logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate18-original-economic-replay
          path: results/gate18/replay_ci/**
          if-no-files-found: error

  endogenous-production:
    name: Gate 19 endogenous production and channel choice (real model)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check global-branch solver and economic counterexamples
        run: python3 -m unittest discover -s tests -p 'test_gate19.py' -v
      - name: Sweep declared endogenous quantity scenarios
        run: python3 scripts/gate19_endogenous.py --out results/gate19
      - name: Archive conditional model and synthetic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate19-endogenous-production
          path: |
            docs/GATE19*
            scripts/gate19_endogenous.py
            tests/test_gate19.py
            results/gate19/**
          if-no-files-found: error

  partial-pooling:
    name: Gate 20 partial pooling and self-batching robustness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check partial venue allocation and fee-potential identity
        run: python3 -m unittest discover -s tests -p 'test_gate20.py' -v
      - name: Compare partial and all-output scenarios
        run: python3 scripts/gate20_partial_pooling.py --out results/gate20
      - name: Archive model qualifications and synthetic comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate20-partial-pooling
          path: |
            docs/GATE20*
            scripts/gate20_partial_pooling.py
            tests/test_gate20.py
            results/gate20/**
          if-no-files-found: error

  designer-menu:
    name: Gate 21 deposit-scale designer and topic-scope checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify design ordering and feasibility accounting
        run: python3 -m unittest discover -s tests -p 'test_gate21.py' -v
      - name: Enumerate approved scale menu with endogenous routing
        run: python3 scripts/gate21_designer.py --out results/gate21
      - name: Archive model scope and synthetic design certificates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate21-designer-menu
          path: |
            docs/GATE21*
            config/research_scope.json
            scripts/gate21_designer.py
            tests/test_gate21.py
            results/gate21/**
          if-no-files-found: error

