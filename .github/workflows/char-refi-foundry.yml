name: CHAR ReFi Foundry validation
on:
  push:
    branches: [research/char-refi-standalone, main]
  workflow_dispatch:
  pull_request:
    branches: [research/char-refi-standalone]

permissions:
  contents: read

jobs:
  source-evm:
    name: Toucan source-level EVM tests (no mainnet claims)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Enforce research boundary and data provenance
        run: python3 scripts/check_research_boundary.py

      - name: Download pinned upstream dependencies
        run: |
          set -euo pipefail
          mkdir -p lib
          git clone https://github.com/ToucanProtocol/dynamic-fee-pools.git lib/dynamic-fee-pools
          git -C lib/dynamic-fee-pools checkout --detach 7aef954dae1bd0c7add4ed66d216251110521b16
          git clone --depth 1 --branch v4.9.6 https://github.com/OpenZeppelin/openzeppelin-contracts.git lib/openzeppelin-contracts
          git clone --depth 1 --branch v4.0.3 https://github.com/PaulRBerg/prb-math.git lib/prb-math
          echo "Foundry $(forge --version)" | tee SOURCE_PIN_MANIFEST.txt
          for d in lib/dynamic-fee-pools lib/openzeppelin-contracts lib/prb-math; do
            echo "$d $(git -C "$d" rev-parse HEAD)" | tee -a SOURCE_PIN_MANIFEST.txt
          done

      - name: Run exact-source EVM boundary tests
        run: |
          set -euo pipefail
          forge test --match-path test/SourceCHARBoundary.t.sol -vvvv 2>&1 | tee FOUNDRY_RESULTS.log

      - name: Execute deployed Base FeeCalculator fork tests (pinned block)
        if: always()
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: |
          set -o pipefail
          RPC="${BASE_RPC_URL:-https://mainnet.base.org}"
          if forge test --match-path test/DeployedFeeCalculatorFork.t.sol \
              --fork-url "$RPC" --fork-block-number 58258072 -vvv \
              2>&1 | tee FORK_RESULTS.log; then
            echo "FORK_EVM_PASS at Base block 58258072" > FORK_STATUS.txt
          else
            echo "FORK_EVM_NOT_VERIFIED_OR_FAILED: check FORK_RESULTS.log" > FORK_STATUS.txt
            exit 1
          fi
          cat FORK_STATUS.txt

      - name: Snapshot current Base state, separately from tests
        if: always()
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: |
          bash scripts/snapshot_base.sh block_state
          cat block_state/STATUS.txt

      - name: Historical FeeSetup transaction and same-block contract state (best effort)
        if: always()
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: |
          bash scripts/audit_historical_base.sh \
            0x1e4187be16964075654028ea7c92c02fc798d4bb097cab53efb5847cd85c91c0 \
            historical_base_evidence
          cat historical_base_evidence/STATUS.txt

      - name: Audit two historical proxy upgrades (archive RPC required)
        if: always()
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: |
          bash scripts/audit_historical_blocks.sh history
          echo "Historical audit done. Every call's STATUS is authoritative; workflow success does not imply matching."

      - name: Discover actual CHAR mint-burn transactions and attempt index-aware replay
        if: always()
        timeout-minutes: 8
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: python3 scripts/audit_char_transactions.py --start 58000000 --end 58258072 --out transaction_evidence

      - name: Archive test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: char-refi-foundry-evidence
          path: |
            transaction_evidence/**
            FOUNDRY_RESULTS.log
            FORK_RESULTS.log
            FORK_STATUS.txt
            SOURCE_PIN_MANIFEST.txt
            block_state/**
            history/**
            historical_base_evidence/**
          if-no-files-found: warn
