name: CHAR ReFi Foundry validation
on:
  push:
    branches: [research/char-refi-standalone, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-evm:
    name: Toucan source-level EVM tests (no mainnet claims)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Enforce research boundary and data provenance\n        run: python3 scripts/check_research_boundary.py\n\n      - name: Download pinned upstream dependencies
        run: |
          set -euo pipefail
          mkdir -p lib
          git clone https://github.com/ToucanProtocol/dynamic-fee-pools.git lib/dynamic-fee-pools
          git -C lib/dynamic-fee-pools checkout --detach 7aef954dae1bd0c7add4ed66d216251110521b16
          git clone --depth 1 --branch v4.9.6 https://github.com/OpenZeppelin/openzeppelin-contracts.git lib/openzeppelin-contracts
          git clone --depth 1 --branch v4.0.3 https://github.com/PaulRBerg/prb-math.git lib/prb-math
          echo "Foundry $(forge --version)" | tee SOURCE_PIN_MANIFEST.txt
          for d in lib/dynamic-fee-pools lib/openzeppelin-contracts lib/prb-math; do
            echo "$d $(git -C "$d" rev-parse HEAD)" | tee -a SOURCE_PIN_MANIFEST.txt
          done

      - name: Run exact-source EVM boundary tests
        run: |
          set -euo pipefail
          forge test --match-path test/SourceCHARBoundary.t.sol -vvvv 2>&1 | tee FOUNDRY_RESULTS.log

      - name: Snapshot current Base state, separately from tests
        if: always()
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: |
          bash scripts/snapshot_base.sh block_state
          cat block_state/STATUS.txt

      - name: Archive test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: char-refi-foundry-evidence
          path: |
            FOUNDRY_RESULTS.log
            SOURCE_PIN_MANIFEST.txt
            block_state/**
          if-no-files-found: warn
