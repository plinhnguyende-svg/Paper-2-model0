name: AI Evaluation Execution Freeze Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/paper2_model0/ai/evaluation_execution.py'
      - 'tests/test_ai_evaluation_execution.py'
      - 'scripts/run_ai_evaluation_execution_dry_run.py'
      - '.github/workflows/ai_evaluation_execution_gate.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install locked scientific runtime
        run: |
          python -m pip install --disable-pip-version-check 'pip==26.2.1'
          python -m pip install -r requirements-ai-training-v0.1.txt -c constraints-ai-training-v0.1.txt
          python -m pip check
      - name: Run execution contract tests
        run: python -m pytest -q tests/test_ai_evaluation_execution.py
      - name: Exercise synthetic interruption and fail-closed recovery
        run: python scripts/run_ai_evaluation_execution_dry_run.py
