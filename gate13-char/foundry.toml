[profile.default]
src = "src"
test = "test"
libs = ["lib"]
solc_version = "0.8.19"
optimizer = true
optimizer_runs = 200
auto_detect_remappings = false
remappings = [
  "dynamic-fee-pools/=lib/dynamic-fee-pools/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@prb/math/=lib/prb-math/"
]
